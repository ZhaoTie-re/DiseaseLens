# The disease profile of idiopathic pulmonary arterial hypertension, written by scripts/new_disease.py from Open Targets 26.09.
# Every value below follows the rule given beside it; edit any of them, then run the pipeline. Only `id`
# is required; the related conditions, GWAS regions, gene themes and curation follow the defaults of the
# pipeline (docs/USAGE.md, "Add a disease").
id: MONDO_0001999            # the Open Targets disease ID (required)
name: 'idiopathic pulmonary arterial hypertension'     # its Open Targets name
short: 'IPAH'          # the shortest acronym among the exact synonyms in Open Targets that spells the name

pubmed:
  # the disease in title or abstract: its name, exact synonyms and short name
  #   acronyms: searched only beside a word of the name (idiopathic OR pulmonary OR arterial OR hypertension)
  terms: '("idiopathic pulmonary arterial hypertension"[tiab] OR (IPAH[tiab] AND (idiopathic[tiab] OR pulmonary[tiab] OR arterial[tiab] OR hypertension[tiab])) OR "primary pulmonary arterial hypertension"[tiab] OR "primary pulmonary hypertension"[tiab])'
  # which studies count as studies of the disease, given to the language-model readers (optional):
  # scope: <one or two sentences>

# The neighbors of the disease in the ontology (all on by default); a parent with too many children is
# left out by the pipeline (MaxOntologyChildren).
# parents:  pulmonary arterial hypertension, chronic pulmonary heart disease
# children: none
ontology:
  category: Disease group   # the category of the ontology neighbors in the products
