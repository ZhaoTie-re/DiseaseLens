# The choices of the CTEPH graph that add to the shared registry (config/choices.yaml): the basis of its one
# curated input, the published table of GWAS regions (gwas_regions.yaml), which any disease can give. An item
# replaces the fields of the shared item with the same key; references added here join the shared ones.
groups:

- name: '{short} genetics'
  items:
  - key: published_regions
    item: GWAS regions of CTEPH
    value: the 9 genome-wide significant regions of the CTEPH GWAS, as published
    basis_type: source
    basis: The only GWAS of CTEPH reports 9 regions at genome-wide significance (Table 1). Open Targets holds no
      summary statistics for this study and fine-mapped only some of them, so the regions are taken from the
      publication and their status in Open Targets is shown beside them.
    refs: [liley]
  - key: region_names
    value: the gene the publication reports; the locus-to-gene genes shown beside it
    basis: The locus-to-gene score is a prediction; at the FGG region its top gene (FGA, 0.44) is below the
      score this project accepts, while the publication names FGG.
    refs: [liley, mountjoy]
  - key: g_codes
    item: G and G* (CTEPH GWAS genes)
    value: G, CTEPH meta-analysis P < 5 × 10⁻⁸; G*, significant only after leveraging PE (V < 5 × 10⁻⁸)
    basis: The publication's thresholds. Its three tiers all correspond to genome-wide significance of the overall
      P value; four further regions (F2, TSPAN15, SLC44A2, F5/NME7) reach it only through the co-analysis with
      PE, whose V values are P values adjusted for the genetic similarity of CTEPH and PE. They are marked apart.
    refs: [liley]

references:
  liley: "Liley, J., Newnham, M., Bleda, M., Bunclark, K., Auger, W., Barbera, J. A., ... & Toshner, M. (2024).
    Shared and distinct genomics of chronic thromboembolic pulmonary hypertension and pulmonary embolism. American
    Journal of Respiratory and Critical Care Medicine, 209(12), 1477–1485. PMID 38470220"
