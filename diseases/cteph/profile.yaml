# The disease profile of chronic thromboembolic pulmonary hypertension, written by scripts/new_disease.py from Open Targets 26.09.
# Every value below follows the rule given beside it; edit any of them, then run the pipeline. Only `id`
# is required; the related conditions, GWAS regions, gene themes and curation follow the defaults of the
# pipeline (docs/USAGE.md, "Add a disease").
id: EFO_0022954            # the Open Targets disease ID (required)
name: 'chronic thromboembolic pulmonary hypertension'     # its Open Targets name
short: 'CTEPH'          # the shortest acronym among the exact synonyms in Open Targets that spells the name

pubmed:
  # the disease in title or abstract: its name, exact synonyms and short name
  #   acronyms: searched only beside a word of the name (chronic OR thromboembolic OR pulmonary OR hypertension)
  terms: '("chronic thromboembolic pulmonary hypertension"[tiab] OR (CTEPH[tiab] AND (chronic[tiab] OR thromboembolic[tiab] OR pulmonary[tiab] OR hypertension[tiab])))'
  # which studies count as studies of the disease, given to the language-model readers (optional):
  # scope: <one or two sentences>

# The neighbors of the disease in the ontology (all on by default); a parent with too many children is
# left out by the pipeline (MaxOntologyChildren).
# parents:  pulmonary hypertension
# children: none
ontology:
  category: Disease group   # the category of the ontology neighbors in the products

# Other Open Targets entries whose evidence (targets, text-mined literature, GWAS, curated genes) is
# fetched with the disease's own; the products name them. Proposed: an entry that a part of a grouping
# name ("A and/or B") names, other than the disease and its descendants.
# evidence_also: []

# Technical, not a rule: the name as the extraction prompt of the first CTEPH build wrote it (with a line break), so
# that the readings cached then are reused rather than paid for again. Used in that prompt only.
prompt_name: "chronic thromboembolic pulmonary\nhypertension"
