# Curation entries of CTEPH, merged with the shared rules of config/curation.yaml (scripts/curate.py).
#   findings     the findings of the CTEPH literature whose result is not an association with CTEPH itself, by kind
#                (the kinds, labels and bases are in config/curation.yaml); each reviewed against its source sentence
#                (2026-10-17); gene_sets: findings that name a group of genes
#   text_mining  words that Europe PMC text mining mapped to the wrong gene in the CTEPH literature, each reviewed
#                against its sentences (2026-10-17)
# An entry of this file that matches nothing stops the build (stale configuration).

# The findings of the CTEPH literature that are not about CTEPH itself, by kind; `match` is a case-insensitive
# substring of the source sentence.
findings:
  within_disease:
    items:
      - {pmid: '15182267', gene: PTGIS, match: 'LL genotype had higher plasma concentrations',
         note: plasma 6-keto-prostaglandin F1alpha by genotype, among patients}
      - {pmid: '16936432', gene: ACE, match: 'lower 6-min walk test distance', note: 6-minute walk distance}
      - {pmid: '16936432', gene: ACE, match: 'independent predictors of survival', note: survival}
      - {pmid: '18931448', gene: HLA-B, match: 'HLA-B*5201-positive female patients', note: clinical phenotype and
           surgical outcome in women}
      - {pmid: '19844076', gene: BMPR2, match: 'worse exercise capacity', note: exercise capacity and quality of life
           in PH}
      - {pmid: '21930318', gene: HLA-B, match: 'more frequent in HLA-B*5201-negative', note: DVT history among
           patients}
      - {pmid: '24531084', gene: GNB3, match: 'time to clinical worsening', note: clinical worsening on sildenafil}
      - {pmid: '26821322', gene: ACE, match: 'time to clinical worsening', note: clinical worsening}
      - {pmid: '26821322', gene: GNB3, match: 'time to clinical worsening', note: clinical worsening}
  other_trait:
    items:
      - {pmid: '41163636', gene: '', match: 'entorhinal surface', note: brain structure on MRI}
      - {pmid: '41163636', gene: '', match: 'lateral ventricular volume', note: brain structure on MRI}
  functional:
    items: []
  background:
    items: []
  # findings that name a group of genes rather than one gene
  gene_sets:
    - {pmid: '26820968', match: 'nonsynonymous mutation rate', label: 'PAH genes (BMPR2, ACVRL1, ENG, SMAD9, CAV1,
         KCNK3, ...)'}
    - {pmid: '39604025', match: 'CH-associated genes', label: clonal-hematopoiesis genes}
    - {pmid: '40221599', match: 'non-classical genes', label: non-classical thrombophilia genes}
  # words in a source sentence that suggest a within-CTEPH finding: a finding of a later snapshot that matches one
  # and is in none of the lists above is logged for review

# Words that Europe PMC text mining mapped to a gene they do not name in the CTEPH literature. A text-mined
# target x publication link whose matched words are all listed here for its gene is dropped; listed words are
# removed from the links that keep another matched word.
text_mining:
  - {gene: SGCB, words: [sGC], meaning: soluble guanylate cyclase (GUCY1A1 / GUCY1B1), example: '41154749'}
  - {gene: PTPA, words: [PTPA], meaning: percutaneous transluminal pulmonary angioplasty, example: '25459043'}
  - {gene: DST, words: [BPA], meaning: balloon pulmonary angioplasty, example: '38674214'}
  - {gene: ACOT8, words: [PTE1], meaning: pulmonary thromboendarterectomy (PTE) with a citation number,
     example: '39550495'}
  - {gene: TF, words: [TF], meaning: tissue factor (F3), not transferrin, example: '35054082'}
  - {gene: FASLG, words: [aPL], meaning: antiphospholipid antibodies, example: '30603858'}
  - {gene: ACLY, words: [aCL], meaning: anticardiolipin antibodies, example: '31134062'}
  - {gene: LCT, words: [LAC], meaning: lupus anticoagulant, example: '31134062'}
  - {gene: BTG3, words: [ANA], meaning: antinuclear antibodies, example: '27006850'}
  - {gene: STUB1, words: [CHIP], meaning: clonal hematopoiesis of indeterminate potential, example: '40499722'}
  - {gene: C4B, words: [CH], meaning: clonal hematopoiesis, example: '39604025'}
  - {gene: CPB1, words: [PASP], meaning: pulmonary artery systolic pressure, example: '39372560'}
  - {gene: PDZK1IP1, words: [sPAP], meaning: systolic pulmonary artery pressure, example: ''}
  - {gene: CA6, words: [CAVI], meaning: cardio-ankle vascular index, example: '34300176'}
  - {gene: NR3C2, words: [MR], meaning: mid-regional pro-atrial natriuretic peptide (MR-proANP), example: '33263045'}
  - {gene: NR1H4, words: [HRR1], meaning: heart rate recovery at 1 minute, example: '35252384'}
  - {gene: PHF12, words: [PF1], meaning: prothrombin fragment 1+2, example: '41300788'}
  - {gene: RENBP, words: [Ag], meaning: antigen (as in vWF:Ag), example: '41300788'}
  - {gene: MMRN1, words: [ECM], meaning: extracellular matrix, example: '33175289'}
  - {gene: MLC1, words: [MLC], meaning: myosin light chain, example: '39550495'}
  - {gene: CUBN, words: [Igs], meaning: immunoglobulins, example: '39965671'}
  - {gene: CD79A, words: [IgA], meaning: immunoglobulin A antibodies, example: '42548663'}
  - {gene: SOAT1, words: [STAT], meaning: STAT signaling (JAK/STAT), example: '39684570'}
  - {gene: TEAD1, words: [Aα], meaning: the fibrinogen Aα chain (FGA), example: '36856592'}
  - {gene: C4A, words: [C4], meaning: PRO-C4, a marker of type IV collagen formation, example: '37178803'}
  - {gene: LTB4R, words: ['LT) B'], meaning: leukotriene B4 (the ligand), a parsing artifact, example: '14652649'}
  - {gene: NOS1, words: [NOS], meaning: endothelial NOS (NOS3), example: '28895506'}
  - {gene: NOS2, words: [NOS], meaning: endothelial NOS (NOS3), example: '28895506'}
  - {gene: PROS1, words: [protein], meaning: the word "protein", example: ''}
  - {gene: VPS11, words: [END1], meaning: not identifiable as VPS11 in the sentence, example: '34153003'}
