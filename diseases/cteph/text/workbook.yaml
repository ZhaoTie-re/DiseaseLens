# The prose of the CTEPH workbook that is specific to CTEPH (read by write_table.py with P.text('workbook', key)).
# profile.py fills {short}, {name} and {Name}; the workbook fills {n}. A disease without a key gets a generic sentence
# built from its data, or the passage is left out.

# Guide, sources: the published table of GWAS regions (gwas_regions.yaml, source)
regions_source_name: Liley 2024, Table 1
regions_source_use: the nine genome-wide significant {short} GWAS regions, as published
# sheet 5, brief: the publication of the regions
regions_cite: Liley 2024
# sheet 1, brief: the line on the GWAS regions ({n}: the number of regions)
gene_map_gwas: 'GWAS: the {n} genome-wide significant regions of the only {short} GWAS (Liley 2024), named by the gene
  the publication reports; regions significant only after leveraging pulmonary embolism are G*.'
# sheet 2: what levels 1 and 2 of the evidence ladder mean
level_1: '{short} meta-analysis P < 5 × 10⁻⁸ (Liley 2024, Table 1).'
level_2: Genome-wide significant only in the co-analysis with pulmonary embolism, V < 5 × 10⁻⁸ (Liley 2024).
# sheet 5, column headers: the definition of the code G
g_code_definition: '{short} meta-analysis P < 5 × 10⁻⁸'
# the code G* (a region significant only in the co-analysis with pulmonary embolism), in three lengths
secondary_brief: only after leveraging PE
secondary_short: significant only after leveraging PE
secondary_long: significant only after leveraging pulmonary embolism
# sheet 1, notes: genes whose findings concern only an outcome within CTEPH
within_examples: ACE, GNB3
# sheet 4, brief: the contrary findings kept
contrary_findings: 'Contrary findings are kept: against survivors of pulmonary embolism, most classic risk factors were
  not enriched (open Risk factor and Comorbidity).'
# sheet 4, footnote of the Ontology column: the ontology neighbors of CTEPH
ontology_relation: 'A relation in the disease ontology: the parent of {short}, its siblings, or a child of pulmonary
  arterial hypertension.'
# sheets 4, 5 and 7: the descriptions of the categories (the profile's are used for the others); multi and single are
# the traits related only by a shared GWAS signal, with two or more regions, or one
category_descriptions:
  PH group: 'Pulmonary hypertension and its other forms: the neighbors of {short} in the disease ontology.'
  multi: Traits without a clinical or ontology relation that share two or more {short} GWAS regions (colocalization
    or lead-variant overlap).
  single: 'Traits that share one {short} GWAS region only, most often the pleiotropic ABO region: weak evidence of a
    relation.'
# sheet 8, brief: an abbreviation of the CTEPH literature that text mining maps to the wrong gene
textmining_example: for example TF, tissue factor, mapped to transferrin
