# The texts of the viewer (build_viewer.py) that are specific to CTEPH, read with P.text('viewer', key). A disease
# without this file gets the generic texts of build_viewer.py. {short}, {name} and {Name} are filled in by
# profile.py; in regions_lead, {n} is the number of published regions, in words (build_viewer.py).

# Overview page, the paragraph under the heading
overview_lead: >-
  The knowledge graph of chronic thromboembolic pulmonary hypertension (CTEPH): the genes with genetic evidence for
  CTEPH and how strong that evidence is, the genetic studies it comes from, the conditions related to CTEPH and the
  genetics they share with it. Every statement links to its source.

# GWAS regions page: the published regions (gwas_regions.yaml: Liley et al. 2024, PMID 38470220, Table 1)
regions_lead: >-
  The {n} genome-wide significant regions of the CTEPH GWAS (Liley 2024, Table 1), named by the gene the
  publication reports.

# Curation page, after the sentence on the publications checked in PubMed
curation_lead: >-
  Retracted articles and conference material are not part of the graph; findings that are not about CTEPH itself
  are kept and marked; words that text mining mapped to the wrong gene are removed. No rule calls a language model.

# Information bar, after "How to cite": the source of the published GWAS regions (gwas_regions.yaml)
cite_sources: >-
  Cite the published GWAS regions as Liley et al. (2024), Am J Respir Crit Care Med 209(12):1477–1485, PMID
  38470220.
