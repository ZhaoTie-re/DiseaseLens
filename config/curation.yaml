# Curation rules shared by every disease: the rules that turn what was fetched and extracted into what the graph
# holds. Read by scripts/curate.py (step CURATE) after merging with the disease's own diseases/<key>/curation.yaml;
# every rule it applies is written, row by row, to 03.curated/curation_log.tsv. No rule calls a language model.
# Text may name the disease as {short} or {name}: it is filled in from the disease profile.
#
#   publications   which publications are left out (retracted; conference material) or flagged, from their PubMed
#                  record (publication type, issue, pagination, abstract), for every PMID the graph uses
#   design_classes one design class per genetic study, by precedence
#   variants       one name (and, where established, an rsID) per variant written several ways in the abstracts; a
#                  disease file may add variants of its own genes
#   findings       the kinds of finding that are not about the disease itself (labels and bases); the findings of each
#                  kind are listed in the disease file, each reviewed against its source sentence
#   countries      the place of a study: the country of its first author's institution (PubMed affiliation)

publications:
  checked_with: PubMed E-utilities efetch (publication types, journal issue, pagination, abstract, affiliations)
  exclude:
    - key: retracted
      label: retracted publication
      pub_types: [Retracted Publication, Retraction of Publication]
      comments: [RetractionIn]
      basis: A retracted article is no longer part of the evidence; a retraction notice is not evidence. PubMed marks
        both by publication type (NLM, Publication Characteristics, https://www.nlm.nih.gov/mesh/pubtypes.html) and
        links a retracted article to its notice (comment type RetractionIn).
    - key: conference
      label: conference abstract or proceedings
      pub_types: [Congress, Conference Proceedings]
      supplement_without_abstract: true
      basis: Conference material is not peer-reviewed in full (the user, 2026-10-17). PubMed types meeting reports as
        Congress; abstracts printed in a journal supplement come without an abstract of their own and a
        supplement issue or S-page (e.g. Chest 2005;128(6 Suppl):619S).
  flag:
    - key: preprint
      label: preprint (not peer-reviewed)
      pub_types: [Preprint]
      id_prefixes: [PPR]
    - key: erratum
      label: published erratum
      pub_types: [Published Erratum]
    - key: concern
      label: expression of concern
      pub_types: [Expression of Concern]

# The first class whose rule a study meets. study_type comes from the extraction; designs are the extracted
# design labels (a study can have several).
design_classes:
  - key: case_report
    label: Case reports
    study_type: case report
  - key: genome_wide
    label: Genome-wide studies (GWAS, genome sequencing, Mendelian randomization)
    designs: [GWAS, whole-genome sequencing, Mendelian randomization]
  - key: clonal
    label: Clonal hematopoiesis and somatic variants
    designs: [clonal hematopoiesis / somatic]
  - key: sequencing
    label: Exome and gene-panel sequencing
    designs: [whole-exome sequencing, targeted gene panel]
  - key: hla
    label: HLA typing
    designs: [HLA typing]
  - key: candidate
    label: Candidate-gene association
    designs: [candidate gene association]
  - key: other
    label: Other designs
    designs: []

# Patterns are case-insensitive regular expressions matched against the variant, gene and quote of a finding of
# the named gene. rsIDs: dbSNP (https://www.ncbi.nlm.nih.gov/snp/), or as the abstract states them.
variants:
  - gene: F5
    name: factor V Leiden (R506Q)
    rsid: rs6025
    patterns: ['(factor\s*V|\bFV|\bF\s?V)\s*lei?d[ae]n', '\bFVL\b', '1691\s*G\s*>\s*A', '\bG1691A\b', '\bR506Q\b',
               '\brs6025\b']
  - gene: F2
    name: prothrombin G20210A
    rsid: rs1799963
    patterns: ['G?20210\s*(G\s*>\s*)?A?\b', '\brs1799963\b']
  - gene: FGA
    name: FGA Thr312Ala
    rsid: rs6050
    patterns: ['Thr\s*312\s*Ala', 'Ala\s*312', '\brs6050\b']
  - gene: FGA
    name: FGA 3' UTR insertion
    rsid: ''
    patterns: ['allele frequency of Ins\b', '3''?\s*UTR']
  - gene: HLA-B
    name: HLA-B*52:01
    rsid: ''
    patterns: ['B\s*\(?\*?\)?\s*52:?01']
  - gene: HLA-DPB1
    name: HLA-DPB1*02:02
    rsid: ''
    patterns: ['DPB1\s*\(?\*?\)?\s*02:?02']
  - gene: NFKBIL1
    name: IKBL-p*03
    rsid: ''
    patterns: ['IKBL-p\s*\(?\*?\)?\s*03']
  - gene: JAK2
    name: JAK2 V617F
    rsid: rs77375493
    patterns: ['V617F', 'Val617Phe', '1849\s*G\s*>\s*T']
  - gene: ACE
    name: ACE insertion/deletion (I/D)
    rsid: ''
    patterns: ['\bD allele', '\bI/D\b', '\bII/TT\b', 'insertion/deletion']
  - gene: GNB3
    name: GNB3 C825T
    rsid: rs5443
    patterns: ['C825T', '825\s*C\s*>\s*T', '\bII/TT\b']
  - gene: MTHFR
    name: MTHFR C677T
    rsid: rs1801133
    patterns: ['C677T', '677\s*C\s*>\s*T']
  - gene: MTHFR
    name: MTHFR A1298C
    rsid: rs1801131
    patterns: ['A1298C', '1298\s*A\s*>\s*C']
  - gene: F13A1
    name: F13A1 Val34Leu
    rsid: rs5985
    patterns: ['V34L', 'Val\s*34\s*Leu']
  - gene: SERPINE1
    name: SERPINE1 (PAI-1) 4G/5G
    rsid: rs1799889
    patterns: ['4G/5G']
  - gene: CYP2C9
    name: CYP2C9*3
    rsid: rs1057910
    patterns: ['CYP2C9\s*\*\s*3']
  - gene: ABO
    name: ABO non-O (rs8176719)
    rsid: rs8176719
    patterns: ['\brs8176719\b', 'non-O']
  - gene: PTGIS
    name: PTGIS promoter VNTR
    rsid: ''
    patterns: ['VNTR', '\bLL genotype']

# What a finding is about (column association_with). Default: the disease itself, i.e. the variant is compared
# between people with the disease and people without it (or found in people with it). The kinds below are findings
# about something else; the findings of each kind are listed, with their source-sentence match, in the disease's
# curation file. Only findings about the disease itself count toward levels 3-6 of the evidence ladder.
findings:
  within_disease:
    label: a phenotype or outcome within {short}
    basis: An association with survival, clinical worsening, exercise capacity, a biomarker, the clinical type or the
      thrombosis history among patients is a modifier of the disease, not evidence that the gene raises its risk.
  other_trait:
    label: another trait, with {short} as the exposure
    basis: A Mendelian randomization study with {short} as the exposure reports effects on another trait, not genes
      of {short}.
  functional:
    label: a functional experiment
    basis: A cell experiment on how a variant acts is not a genetic association.
  background:
    label: a background statement, not a finding of the study
    basis: The sentence restates earlier knowledge about another disease; the study did not test it.
  # words in a source sentence that suggest a finding within the disease: a finding of a later snapshot that matches
  # one and is in none of the disease's lists is logged for review
  review_words: ['surviv', 'mortality', 'worsening', 'walk', 'exercise', 'quality of life', 'predictor', 'severity',
                 'prognos', 'response to', 'plasma concentration', 'phenotype', 'operative', 'among patients']

# The country of the first author's institution: the last country named in the first affiliation. Names are
# matched as words; aliases map to one name; a US state or a city stands for its country when no country is named.
countries:
  names: [Japan, China, Korea, Taiwan, Hong Kong, Mongolia, Singapore, Thailand, India, Iran, Turkey, Israel, Egypt,
          Saudi Arabia, United Kingdom, Ireland, France, Germany, Austria, Switzerland, Italy, Spain, Portugal,
          Netherlands, Belgium, Denmark, Sweden, Norway, Finland, Poland, Czech Republic, Hungary, Greece, Serbia,
          Croatia, Slovenia, Russia, Ukraine, Romania, Bulgaria, United States, Canada, Mexico, Brazil, Argentina,
          Chile, Australia, New Zealand, South Africa]
  aliases:
    USA: United States
    U.S.A.: United States
    United States of America: United States
    UK: United Kingdom
    U.K.: United Kingdom
    England: United Kingdom
    Scotland: United Kingdom
    Wales: United Kingdom
    Czechia: Czech Republic
    P.R. China: China
    PR China: China
    People's Republic of China: China
    Republic of Korea: Korea
    South Korea: Korea
    The Netherlands: Netherlands
    Türkiye: Turkey
  # an institution named after two countries is not a statement of place
  ignore: [China-Japan Friendship, Sino-Japanese, Japan-China]
  cities:
    Beijing: China
    Shanghai: China
    Tokyo: Japan
    Chiba: Japan
    Seoul: Korea
    London: United Kingdom
    Cambridge: United Kingdom
    Papworth: United Kingdom
    Vienna: Austria
    Paris: France
    Boston: United States
    Rochester: United States
    Salt Lake City: United States
  us_states: [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT,
              NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY,
              California, Massachusetts, Minnesota, Utah, Texas, Pennsylvania, Maryland, Ohio, Michigan, Illinois]
  east_asian: [Japan, China, Korea, Taiwan, Hong Kong, Mongolia]

# The check of a finding's result against its own source sentence (case-insensitive regular expressions): a finding
# read as "not associated" whose sentence matches no `negative` pattern, or read as "associated" / "enriched" whose
# sentence matches a `negative` pattern and no `positive` one, is flagged for review (it is not dropped).
result_check:
  negative: ['\bno(t)?\b[^.;]{0,60}\b(significant|associat|differ|correlat)', '\bnon-?significant', '\bfailed to\b',
             '\bdid not\b', '\bwas not\b', '\bwere not\b', '\bneither\b', '\bnot associated']
  positive: ['significant', 'associated with', 'increased risk', 'higher (frequency|risk)', 'more frequent',
             'odds ratio', '\bOR\b', '\bp\s*[<=]\s*0?\.0[0-4]']
