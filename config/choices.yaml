# Every choice that decides what enters a disease's knowledge graph: the value used and its basis. Shared by every
# disease; a disease's own diseases/<key>/choices.yaml adds items, and replaces the fields of an item with the same
# key (a field set to null is removed). profile.py merges the two and fills in {short}, {name} and {Name}.
#
# Read by the workbook (sheet "11 Choices and basis", and the footnotes that name a threshold), the knowledge base
# (section "Choices and their basis") and the slides. When `param` is given, the value shown is the one the run used
# (from its parameters), never a copy typed here.
#
# basis_type:
#   source      a publication or the documentation of a data source; `refs` names entries of `references`
#               below (APA, formatted from PubMed efetch, or a documentation URL with its access date)
#   data check  a check on this snapshot's data that the choice passed; the check is computed and shown
#   design      a decision of this project, with its reason
#   user        decided with the user, on the date given
# check: a data check computed on the snapshot (ot_common.load_choices): regions, single_region, curated_genes,
# readers; benchmark: PMIDs the literature search must find, keep and include.
# Every statement attributed to a source was checked against its full text or documentation (2026-10-17).
# verify.sh checks that every entry has a basis and that every reference resolves.
groups:

- name: Scope and sources
  items:
  - key: fetch_date
    item: Snapshot date
    param: FetchDate
    basis_type: design
    basis: Each run is one dated snapshot; PubMed is searched up to this date and Open Targets is read in its
      release of the day, so that a later snapshot can be compared with this one.
    used_in: every step
  - key: disease
    item: '{short} identifier'
    param: DiseaseCore
    basis_type: source
    basis: The Open Targets disease identifier (EFO or MONDO) of {name}, given in the disease profile.
    refs: [ot]
    used_in: every step
  - key: evidence_scope
    item: Open Targets evidence of {short}
    value: the disease and its descendants (targets, text-mined literature, GWAS, curated genes), with the entries its
      profile names in evidence_also
    basis_type: user
    basis: Decided with the user (2026-10-20). Open Targets maps evidence to the most specific entry, and a disease's
      subtypes are part of it. A grouping name ("A and/or B") joins diseases that Open Targets can hold as entries of
      their own, with their literature; a new profile proposes such an entry (evidence_also) and says when the
      disease itself has no literature or GWAS evidence, and the products name the entries whose evidence is merged.
    used_in: every step
  - key: sources
    item: Data sources
    value: Open Targets Platform; PubMed; Europe PMC
    basis_type: source
    basis: Open Targets integrates GWAS credible sets, locus-to-gene genes, colocalization, curated gene evidence
      and text mining for target–disease pairs; PubMed holds the primary studies; Europe PMC serves the
      open-access full texts.
    refs: [ot, epmc]
    used_in: every step
  - key: external_only
    item: External knowledge only
    value: no results of the user's own studies
    basis_type: user
    basis: Decided with the user (2026-10-16), so that the graph can be used to interpret a study's own signals
      without circularity.
    used_in: every step
  - key: excluded
    item: Not included
    value: drugs, animal models
    basis_type: user
    basis: Decided with the user (2026-10-16); they do not bear on the interpretation of genetic signals.
    used_in: scope

- name: '{short} genetics'
  items:
  - key: published_regions
    item: GWAS regions of {short}
    value: the genome-wide significant credible sets of the GWAS of {short} in Open Targets, merged when their lead
      variants lie close together
    basis_type: design
    basis: Without a published table of regions in the disease profile, the regions are those Open Targets
      fine-mapped for the disease's own GWAS. Credible sets of several studies at one locus are one region.
    check: regions
    used_in: sheets 1, 2, 5; evidence grid, regions figure
  - key: region_window
    item: Width of a GWAS region
    param: RegionWindowKb
    format: lead variants within {v} kb
    basis_type: design
    basis: Credible sets of several GWAS of the disease at one locus are one region when their lead variants lie this
      close; the usual span of linkage disequilibrium around a lead variant, not tuned.
    used_in: sheets 1, 5
  - key: genome_wide
    item: Genome-wide significance of a GWAS region
    param: GenomeWideP
    format: lead P < {v}
    basis_type: source
    basis: The conventional genome-wide significance threshold for common variants in European-ancestry GWAS.
    refs: [kraft]
    used_in: sheets 1, 2, 5
  - key: region_mac
    item: A credible lead of a GWAS region from Open Targets - copies of the minor allele
    param: RegionMinMac
    format: at least {v} expected copies of the lead's minor allele in the smaller group of its study (2 x n x MAF;
      MAF of the study's largest ancestry group, gnomAD as Open Targets gives it)
    basis_type: source
    basis: Rare variants are evidence when they are credible (user, 2026-10-20). A case-control test needs about 25
      copies of an allele in the smaller group to reach genome-wide significance, and fewer give miscalibrated tests;
      the Neale lab filters the UK Biobank GWAS of binary traits so. A lead below it, or a rare lead above the P of
      a rare variant, still makes a region when another GWAS study of the disease has a genome-wide significant
      credible set within the region window (replication); otherwise it is listed with its reason and is no region
      (IPAH, 2026-10-20 - the fourteen signals of one biobank PheCode GWAS had 0 to 23 expected copies in its cases).
      The regions of a published table are as published.
    refs: [neale2017, kraft]
    used_in: sheets 1, 2, 5
  - key: region_rare_p
    item: A credible lead of a GWAS region from Open Targets - P of a rare lead
    param: RareVariantP
    format: P < {v} for a lead rarer than the frequency of a common variant (below)
    basis_type: source
    basis: P < 5e-8 corrects for the common variants of the genome; tested together with rare variants, a study of
      European, Asian or admixed samples needs about 5e-9 (1e-9 for African samples).
    refs: [pulit2017]
    used_in: sheets 1, 2, 5
  - key: region_maf
    item: A credible lead of a GWAS region from Open Targets - a rare lead
    param: RegionMinMaf
    format: minor allele frequency below {v} in the study's largest ancestry group
    basis_type: design
    basis: The frequency below which a lead is a rare variant and is held to the P of a rare variant (above).
    used_in: sheets 1, 2, 5
  - key: region_names
    item: Name of a GWAS region
    value: the top locus-to-gene gene, when its score reaches the locus-to-gene threshold; otherwise the position
      of the lead variant
    basis_type: source
    basis: The locus-to-gene score predicts the causal gene of a credible set; below the threshold the prediction
      is too uncertain to name the region or to give a gene the code G.
    refs: [mountjoy]
    used_in: every sheet that names a GWAS region
  - key: g_codes
    item: G and G* (GWAS genes of {short})
    value: G, lead P < 5 × 10⁻⁸ in a GWAS of {short}; G*, significant only in a secondary analysis of a published
      GWAS
    basis_type: source
    basis: P < 5 × 10⁻⁸ is the conventional genome-wide significance threshold. G* is used only when a published
      table of regions names regions that reach it only through a secondary analysis; they are marked apart.
    refs: [kraft]
    used_in: sheets 1, 2, 6; evidence grid, gene map
  - key: curated_core
    item: C (curated gene evidence for {short})
    param: MendelianMin
    format: Open Targets source score ≥ {v}; ClinVar alone, a pathogenic record of two stars or more
    basis_type: source
    basis: The rule used for the curated evidence of the related conditions, applied to {short} itself and its
      ontology descendants (ClinGen, Gene2Phenotype, PanelApp, Orphanet, ClinVar, UniProt, gene burden); ClinVar
      alone counts only with a pathogenic or likely pathogenic record of two stars or more. A gene with such
      evidence is placed at level 1 with the code C.
    refs: [otdocs_evidence, otdocs_assoc]
    check: curated_genes
    used_in: sheets 1, 2; evidence grid
  - key: ladder
    item: Evidence ladder of a {short} gene
    value: the same seven levels for every disease - 1 G / C genome-wide or curated evidence; 2 G* secondary GWAS
      analysis; 3 replicated association; 4 single-study association; 5 variant reported, not tested; 6 tested, not
      associated; 7 no result about {short} itself (an empty level is shown with its reason)
    basis_type: source
    basis: A gene takes its strongest level. Genome-wide significance and curated gene–disease evidence (level 1)
      come first; association in two or more studies (level 3) ranks above a single study because replication is
      what makes an association credible rather than a chance finding. Studies are counted, not independent
      samples. Levels 3–6 count only findings about {short} itself; a gene whose findings concern only an outcome
      within {short} or another trait, or that a study names without an association, a variant or a negative test,
      stays at level 7, with the reason given for each gene (user, 2026-10-20 - formerly "other result only"). A
      gene in no genetic study of {short} (a text-mined target, or a gene of a related condition) has no level.
    refs: [kraft]
    used_in: sheets 1, 2; evidence grid
  - key: themes
    item: Function of a gene (gene theme)
    value: the curated themes of the profile; for a gene they do not list, or without them, the Reactome top-level
      pathway of the gene
    basis_type: source
    basis: Each gene the curated themes do not list (all genes, without curated themes) joins its Reactome top-level
      pathway that holds the most of these genes ("Disease", a mirror of disease variants, is not used). Genes
      without a Reactome pathway in Open Targets are listed as "No Reactome pathway" (ENG and TBX4 have none in
      Open Targets 26.09).
    refs: [reactome]
    used_in: sheets 1, 2; evidence grid

- name: Related conditions
  items:
  - key: categories
    item: Categories of related conditions
    value: precursor / spectrum (progresses to the disease, or a stage of one process with it); risk factor (a
      disease, exposure, procedure or inherited trait such as a blood group, present before it, raising or lowering
      its risk); comorbidity (more frequent with it, without evidence that it came first); intermediate trait (a
      measurable level between genotype and disease, such as a blood level or a biomarker); the disease group of the
      ontology; a shared genetic signal only
    basis_type: user
    basis: The kinds of clinical relation a guideline or study states, and the neighbors of the disease in its
      ontology, kept apart from relations by a shared genetic signal only. Each evidence row gets its category from
      the readers, checked row by row in the verification; a condition takes the most frequent category of its own
      rows (majority vote, decided with the user, 2026-10-20), the rows of a characteristic attached to it not
      voting. A blood group is a risk factor, not an intermediate trait (decided with the user, 2026-10-20), since
      it is present from birth and the clinical literature calls it one; intermediate traits are measured levels.
    used_in: sheet 4; condition map
  - key: relations_source
    item: Source of the clinical relations
    value: a curated list with verbatim quotes in the disease profile; else PubMed guidelines, meta-analyses and
      systematic reviews read by two independent language-model readers
    basis_type: user
    basis: Decided with the user (2026-10-19). Every relation keeps a verbatim quote of its PubMed abstract, and a
      relation read from the literature must be found by both readers or confirmed by an adjudicating call; a
      relation that rests on one publication is marked as weak.
    used_in: sheet 4
  - key: clinical_rule
    item: Clinical relation
    value: a PubMed title or abstract states the relation between the condition and the disease, in human patients
      or populations; its sentence is quoted
    basis_type: design
    basis: Every clinical relation must be traceable to a sentence of a primary source. The quote is re-checked
      against the abstract fetched at each build, and the build stops if it is not found. A sign or finding of the
      disease itself, a mechanism, a demographic attribute (sex, age, race or ethnicity, decided with the user,
      2026-10-20), an animal or cell experiment, a comparison between groups of patients, or a result for a broader
      group in which the disease's patients are a minority does not relate two conditions.
    used_in: sheet 4 (evidence rows)
  - key: consolidation
    item: Consolidation of the conditions read from PubMed
    value: one decision per condition of the list (keep, merge with another, attach to another as a characteristic of
      its patients, drop), by the two readers apart and the adjudicator where they differ
    basis_type: user
    basis: Decided with the user (2026-10-20). Read one record at a time, one condition comes out under several names,
      and a characteristic of a related condition (unprovoked or massive pulmonary embolism) as a condition of its
      own. A merged condition is named by its member with an Open Targets entry and keeps every member's entry; a
      narrower disease of its own is never merged into a broader one; every moved statement starts with the name it
      was read under, its quote unchanged.
    used_in: sheet 4; sheet 10
  - key: verification
    item: Verification of every evidence row and every condition
    value: each row is kept with its category or dropped with a reason (not about the disease, no relation stated,
      a comparison with another disease only, a consequence or finding of the disease, another form of its parent
      class); each condition is kept, dropped, merged or attached; two readers apart, the adjudicator where they
      differ
    basis_type: user
    basis: Decided with the user (2026-10-20), after an audit of every related condition of the first four graphs
      found about half with a problem that the source-text check cannot see (a quote that is background or a study
      aim, a result about another disease or outcome, a comparison with another disease's patients, a condition that
      defines another form of the parent class under an older umbrella name). The readers are given the ontology
      siblings of the disease. Every decision, with both readings and the adjudicator's reason, is listed. A result
      for patients defined by a wider diagnosis, spectrum or stage that also holds patients without the disease is
      not about the disease unless the record gives it apart (decided with the user, 2026-10-21).
    used_in: sheet 4; sheet 10
  - key: condition_mapping
    item: Mapping a condition to Open Targets
    value: its name, its usual name, and for a level written with its direction or measure ('Elevated factor VIII')
      the trait as Open Targets names measured traits; never an ancestor of the disease; a descendant is one of its
      own subtypes and left out
    basis_type: design
    basis: A name must equal an entry's name or exact synonym. An ancestor of the disease (hypertensive disorder for a
      form of pulmonary hypertension) names a class the disease belongs to, not a related condition. A condition
      without an entry has one key in every disease, the words of its name without those of use or exposure.
    used_in: sheet 4
  - key: relation_design
    item: Design of the publication behind a clinical relation
    value: guideline or consensus; meta-analysis or systematic review; cohort or case-control study; cross-sectional
      or other observational study; case report; other or not stated (best first)
    basis_type: design
    basis: From the PubMed publication types and MeSH design headings as NLM indexes each record, so that the design
      is not the reading of a model; a case report stays one whatever else it is indexed with. The readers' design
      words count only for a record NLM has not indexed yet. The evidence matrix of the viewer shows the best design
      among the publications that relate a condition; it is shown, not used to grade or to filter.
    used_in: viewer (related conditions)
  - key: joined_names
    item: A name that joins several conditions
    value: split into the conditions it joins when each is listed on its own
    basis_type: user
    basis: Decided with the user (2026-10-20). A reader can name several conditions at once ('Protein C deficiency /
      protein S deficiency', from 'protein C and S deficiency'). When every part of such a name is another listed
      condition, its evidence supports each of them and the joined name is not a condition of its own; otherwise it
      is kept, and the consolidation decides. Done by rule before the consolidation, without a model.
    used_in: sheet 4
  - key: contrary
    item: Contrary findings
    value: a study that found no association is kept beside a relation, labeled by its direction, but never makes one;
      a condition whose clinical evidence all found no association is not a related condition (listed apart)
    basis_type: user
    basis: Reporting only positive findings would overstate a relation, so studies that found no association stay
      beside the positive ones; but a finding of no association is not an association (user, 2026-10-20). The
      direction is judged like every decisive item, by the two readers apart and the adjudicator where they differ
      (or given by the curated list); a relation counts only with a direction other than no association.
    used_in: sheet 4; condition map
  - key: ontology
    item: Ontology neighbors
    value: parents of {short}; their other children; children of {short}
    basis_type: design
    basis: The disease ontology places {short} among related diseases, which are its neighbors. They are kept as a
      separate, weaker evidence type, since the ontology states a classification, not a clinical relation.
    used_in: sheet 4
  - key: ontology_children
    item: A parent too broad to give neighbors
    param: MaxOntologyChildren
    format: more than {v} children
    basis_type: design
    basis: A parent class with very many children (such as "hereditary disease") groups diseases by a property, not by
      relatedness; it and its children are left out, and the ontology log names it.
    used_in: sheet 4
  - key: clpp
    item: Colocalization with a {short} credible set (eCAVIAR CLPP)
    param: ClppMin
    format: CLPP ≥ {v}
    basis_type: source
    basis: The cut-off the eCAVIAR authors used to conclude that a causal variant is shared, and the one the Open
      Targets team uses together with H4 (preprint). Open Targets' documentation states no cut-off.
    refs: [ecaviar, tsepilov]
    used_in: sheets 4, 5, A3; regions figure
  - key: h4
    item: Colocalization with a {short} credible set (coloc H4)
    param: H4Min
    format: H4 ≥ {v}
    basis_type: source
    basis: '"COLOC PH4 ≥ 0.8 or eCAVIAR CLPP ≥ 0.01" is the rule of the Open Targets team (preprint, not peer
      reviewed); the coloc authors called PP4 > 0.75 strong support. Open Targets computes both for each pair of
      credible sets (in this release, method COLOC_PIP_ECAVIAR); nearly every pair kept passes both cut-offs.'
    refs: [tsepilov, coloc]
    used_in: sheets 4, 5, A3
  - key: overlap
    item: Lead-variant overlap (regions without a {short} credible set)
    param: OverlapPipMin
    format: lead-variant PIP ≥ {v}
    basis_type: user
    basis: Without a {short} credible set, colocalization cannot be computed. If the {short} lead variant were the
      causal variant, the CLPP of the pair would equal that variant's posterior inclusion probability (PIP) in the
      other credible set. It is an upper bound, hence a weaker kind of evidence, shown apart, and a low PIP in a
      polygenic trait's credible set is chance overlap; the PIP must be at least this (decided with the user,
      2026-10-20, after the audit).
    refs: [ecaviar]
    used_in: sheets 4, 5, A3; regions figure
  - key: loci_grading
    item: Strength of a shared signal
    value: two or more {short} regions (stronger); one region (weak)
    basis_type: data check
    basis: A region can act on another trait through a pathway unrelated to {short} (pleiotropy). Two or more
      shared regions point to a shared mechanism; one region alone is weak evidence.
    check: single_region
    used_in: sheets 4, 5; condition map
  - key: min_shared_regions
    item: Traits related only by a shared GWAS signal
    param: MinSharedRegions
    format: at least {v} {short} regions shared
    basis_type: user
    basis: Decided with the user (2026-10-20). One shared region alone, often a pleiotropic one (ABO is associated
      with many unrelated traits), does not relate a trait to {short} by itself; shared signals in several regions
      point to a shared mechanism. A trait related only by shared signals enters when it shares at least this many
      of the {short} regions; the signals of a condition related by clinical or ontology evidence count however many
      regions they share. A disease with fewer regions than this has no trait related by a shared signal alone. The
      traits left out are counted and named (tidy.json). The colocalization cut-offs stay those of the method's
      authors.
    refs: [ecaviar, tsepilov]
    used_in: sheets 4, 5; condition map
  - key: joint_traits
    item: GWAS studies of several traits jointly
    value: left out of the shared signals (the trait patterns are part of the shared curation rules)
    basis_type: user
    basis: Decided with the user (2026-10-20). A multi-trait or pleiotropy analysis ("Venous thromboembolism or
      fibrinogen levels (pleiotropy)") can be driven by one of its traits alone, so its signal is no trait's own.
    used_in: sheets 4, 5
  - key: study_once
    item: A GWAS study counts once
    value: a study that Open Targets maps to a condition related by clinical or ontology evidence and to other
      conditions supports that condition only
    basis_type: user
    basis: Decided with the user (2026-10-20). One study is mapped to several entries (a pulmonary embolism study also
      to pulmonary infarction, or a medication question to drug use), so the same signal would relate a condition
      again under another name.
    used_in: sheets 4, 5
  - key: duplicate_traits
    item: Traits related only by shared signals that are one trait
    param: DuplicateStudyShare
    format: GWAS studies shared ≥ {v} (Jaccard)
    basis_type: user
    basis: Decided with the user (2026-10-20). Two Open Targets entries whose supporting studies nearly coincide
      (phlebitis and thrombophlebitis) carry one signal; they are one trait, named by the one with more studies.
    used_in: sheets 4, 5

- name: Genetics of the related conditions
  items:
  - key: genetics_mode
    item: Depth of genetic retrieval
    value: all GWAS and curated evidence; shared signals only; none
    basis_type: design
    basis: Conditions without an Open Targets record get none. Traits related only by a shared signal keep only
      their shared signals, and so do a condition with more GWAS studies than the limit, a broad class and a
      comorbidity from too few publications, so that general traits do not flood the gene map with unrelated genes.
    used_in: sheets 4, 7
  - key: broad_class
    item: Broad classes among the related conditions
    param: MaxDescendants
    format: more than {v} descendants in the disease ontology
    basis_type: user
    basis: Decided with the user (2026-10-20). An Open Targets entry with many descendants (heart disorder, protein
      measurement) is a class of conditions, and its own GWAS and curated genes are those of its many subtypes.
      Related by clinical or ontology evidence, a broad class keeps its relation and its shared signals, but its own
      genetics are not fetched; related only by shared signals, it leaves the graph, since each subtype that shares
      a signal is listed on its own. The limit is about the 95th percentile of the related conditions of the first
      four graphs, whose median is one descendant.
    used_in: sheets 4, 7; gene map
  - key: comorbidity_genetics
    item: Genetics of a comorbidity
    param: ComorbidityMinPublications
    format: fetched in full from {v} publications
    basis_type: user
    basis: Decided with the user (2026-10-20). A comorbidity is seen with {short} without evidence that it came first,
      so its own GWAS and curated genes say little about the causes of {short} until the relation is established. A
      condition related only as a comorbidity (the categories the profile marks as co-occurrence), by fewer
      publications than this, keeps its relation and its shared signals, but its own genetics are not fetched; a
      common disease reported once with {short}, such as a cancer, would otherwise bring its many GWAS genes into the
      gene map. A condition that is also an ontology neighbor keeps its full genetics.
    used_in: sheets 4, 7
  - key: max_gwas
    item: GWAS studies of a condition fetched in full
    param: MaxGwasStudies
    format: at most {v} studies
    basis_type: design
    basis: A condition with more GWAS studies (a general blood or anthropometric trait) keeps only its signals
      shared with the disease.
    used_in: sheets 4, 7
  - key: l2g
    item: GWAS gene of a condition (locus-to-gene score)
    param: L2gMin
    format: score ≥ {v}
    basis_type: source
    basis: The classification threshold of the locus-to-gene model (precision 0.73, recall 0.53 against curated
      gold-standard genes); Open Targets displays scores from 0.05 upward.
    refs: [mountjoy]
    used_in: sheets 6, 7; gene map
  - key: curated
    item: Curated gene evidence (source score)
    param: MendelianMin
    format: Open Targets source score ≥ {v}; ClinVar alone, a pathogenic record of two stars or more
    basis_type: source
    basis: The score is Open Targets' harmonic sum of a source's evidence scores, scaled to 0–1. At 0.5 it keeps
      genes with at least one strong record (ClinGen or Gene2Phenotype strong or definitive, PanelApp green,
      Orphanet assessed, UniProt high, a ClinVar pathogenic record) or several weaker ones; one moderate, amber or
      likely-pathogenic record alone does not reach it. A ClinVar link counts only with a pathogenic or likely
      pathogenic record whose review status has two stars or more (multiple submitters without conflicts, an
      expert panel or a practice guideline); a single submitter, or a record without assertion criteria, is not
      enough. A gene without an approved symbol is left out.
    refs: [otdocs_evidence, otdocs_assoc]
    used_in: sheets 6, 7, A4; gene map
  - key: eas
    item: East Asian GWAS study
    param: EasMin
    format: East Asian share ≥ {v}
    basis_type: design
    basis: A study is called East Asian when East Asians are at least half of its linkage-disequilibrium reference
      sample, as Open Targets records it.
    used_in: sheets 4, 7, 9, A1
  - key: gene_link
    item: Gene–condition link (G, C, L)
    value: G GWAS; C curated evidence; L a genetic study of {short}
    basis_type: design
    basis: The kinds of genetic evidence are kept apart so that a reader can see which kind links a gene to a
      condition. G follows the locus-to-gene threshold for the related conditions and the GWAS regions for {short}
      (G* when significant only in a secondary analysis); C follows the curated threshold; L requires an
      association, enrichment or variant reported by a genetic study of {short}.
    used_in: sheet 6; gene map

- name: Genetic studies of {short} in the literature
  items:
  - key: query
    item: PubMed search
    param: PubmedQuery
    basis_type: design
    basis: '{short} in title or abstract and a genetics term in title or abstract, in PubMed on the fetch date (entry
      date, so that the same date finds the same records later). Written from the disease ID: the name (always) and
      the exact synonyms of Open Targets, without terms that also name a gene or another disease; an acronym only
      beside a word of the name, since an acronym alone names other things too; a short name made up from initials
      never.'
    used_in: sheet A6
  - key: prescreen_types
    item: Pre-screen by record type
    value: review, systematic review, guideline, editorial, comment, news, consensus statement excluded
    basis_type: design
    basis: These record types report no original genetic data.
    used_in: sheet A6
  - key: prescreen_terms
    item: Pre-screen by genetic-study terms
    param: Prescreen
    basis_type: design
    basis: A record whose title and abstract name no genetic-study term (polymorphism, genotype, allele, mutation,
      sequencing, exome, genome-wide, HLA, SNP, rsID, germline, somatic, clonal hematopoiesis, Mendelian
      randomization, haplotype, linkage, ...; the full list is in the shared search rules) is excluded before any
      model reads it.
    used_in: sheet A6
  - key: inclusion
    item: Inclusion of a study
    value: an original study or case report with genetic data from {short} patients
    basis_type: design
    basis: The question is what genetic studies of {short} found; reviews, expression-only studies and animal-only
      studies hold no such data.
    used_in: sheets 2, 3, A5
  - key: batch
    item: Abstracts per screening call
    param: LlmBatch
    format: '{v} abstracts'
    basis_type: design
    basis: Fewer calls while each abstract stays short enough to be read in full; the value was not tuned.
    used_in: screening
  - key: model
    item: Language models
    param: LlmReaders
    basis_type: design
    basis: The two readers and the adjudicator are three different models, each named rather than left to a
      backend's default, which changes with the backend's version; the run manifest records the model that answered.
      Answers are cached per model and prompt, so a change of model re-reads every record.
    used_in: screening, extraction, relations, summaries
  - key: readers
    item: Two independent readers
    value: every record read by two models that never see each other's answer; a disagreement is decided by an
      adjudicating call
    basis_type: user
    basis: Decided with the user (2026-10-19). Only items both readers report, or the adjudicator confirms against
      the text, enter the graph; the adjudicated items are marked and listed with both readings. The adjudicator is
      a third model, and reads the two readings in an order that alternates from record to record (fixed by the
      record), so that it favors neither reader by position.
    check: readers
    used_in: sheets 2, 3, 4, 10
  - key: comparison
    item: What the two readers are compared on
    value: inclusion; sample sizes; Japanese and East Asian flags; each finding (gene and result); each methods field
      (overlapping quotes); each clinical relation (condition, direction and category)
    basis_type: design
    basis: The items that decide what the graph counts. A finding is identified by its gene (official symbol, else
      the gene as written) and result, "enriched" counting as "associated"; a methods field agrees when both quotes
      overlap (one contains the other, or they share at least 60% of the words of the shorter); a relation is
      identified by the condition's usual name, its direction (any positive direction counting as one) and its
      category. The
      descriptive fields (reason, design wording, country, control type) are taken from the first reader.
    used_in: sheets 2, 3, 4, 10
  - key: result_check
    item: Check of a finding's result against its sentence
    value: negation or non-significance words for "not associated"; significance words or P < 0.05 for
      "associated"
    basis_type: design
    basis: A finding whose result disagrees with the wording of its own source sentence is flagged for review; the
      word patterns are listed in the curation rules.
    used_in: sheet 10
  - key: methods_fields
    item: Methods fields extracted
    value: 15 fields (cohort, diagnosis, controls, DNA source, platform, sequencing, HLA typing, variant calling and
      QC, imputation, statistical test, covariates, multiple testing, replication, power, software)
    basis_type: source
    basis: Twelve fields follow the STREGA reporting guideline for genetic association studies (items 3, 5–8, 12
      and 16); power relates to its item 10 (study size); sequencing and HLA typing are added for the designs of
      these studies.
    refs: [strega]
    used_in: sheet 3
  - key: fallback
    item: Source of the methods
    value: open-access Methods section; else the abstract
    basis_type: user
    basis: Decided with the user (2026-10-16); methods from the abstract when no full text can be fetched, marked
      as such.
    used_in: sheet 3
  - key: grounding
    item: Grounding of extracted items
    value: every gene, variant, number and quote must occur in the source text
    basis_type: design
    basis: A language model can produce text that is not in its input; an item that cannot be found in the source
      is dropped and logged.
    used_in: sheets 2, 3
  - key: isolation
    item: Isolation of the language model
    value: no tools, no project memory, no saved session
    basis_type: design
    basis: The extraction must rest on the record alone; nothing of the user's own data or notes may reach it. The
      command-line backend runs with every customization off; the API backends send the prompt alone.
    used_in: screening, extraction, summaries

- name: Mechanisms and summaries
  items:
  - key: reactome
    item: Mechanism themes
    value: Reactome top-level pathways
    basis_type: source
    basis: Open Targets annotates each target with its Reactome pathways; the top-level pathway is the broadest
      stable grouping.
    refs: [reactome]
    used_in: sheet 8
  - key: theme_size
    item: Input of a mechanism summary
    param: ThemeTargets
    format: '{v} best-scored targets'
    basis_type: design
    basis: Up to two sentences from the two best-scored publications of each of the best-scored targets of a
      theme; the input stays small enough to be checked sentence by sentence.
    used_in: sheet 8
  - key: theme_min
    item: Smallest theme summarized
    param: MinThemeTargets
    format: '{v} targets'
    basis_type: design
    basis: A summary resting on one or two targets would restate their sentences rather than synthesize a theme.
    used_in: sheet 8
  - key: sentences
    item: Sentences kept per text-mined publication
    param: SentencesPerPaper
    format: '{v} sentences'
    basis_type: design
    basis: The sentences that name both the target and {short}, abstract first; enough to judge a link without
      reproducing the paper.
    used_in: sheet 8
  - key: summary_checks
    item: Checks of a generated summary
    value: every cited PMID among the inputs; every gene symbol of the material it names in the source text; every
      claim checked by the second reader
    basis_type: design
    basis: A summary may only state what its source records contain. The second reader lists the claims it finds
      unsupported, and the adjudicator rules on each, true or false; a summary that fails, that was not checked, or
      whose disputed claims are not each ruled on is withheld, with the reason.
    used_in: sheets 2, 3, 8
  - key: smoke
    item: Smoke-run limits
    param: LlmLimit
    format: 'off ({v})'
    basis_type: design
    basis: Limits for a quick test run (first N records, largest themes only); a full snapshot runs with both off,
      and the run manifest records it.
    used_in: test runs only

- name: Curation of the literature
  items:
  - key: exclusion
    item: Publications left out
    value: retracted (publication type Retracted Publication or Retraction of Publication, or a RetractionIn link);
      conference material (publication type Congress or Conference Proceedings, or a journal-supplement record
      without an abstract)
    basis_type: user
    basis: Decided with the user (2026-10-17) that conference abstracts and retracted articles are not evidence.
      PubMed marks both by publication type and links a retracted article to its notice; every publication the
      graph uses is looked up, and a left-out publication leaves every table it was in.
    refs: [nlm_pubtypes]
    used_in: every sheet; sheet 10
  - key: flags
    item: Publications flagged and kept
    value: preprint; published erratum; expression of concern
    basis_type: design
    basis: Not reasons to leave a publication out, but to read it with care (a preprint is not peer-reviewed); the
      flag is shown with every link to it.
    used_in: sheet 10, A5
  - key: textmining_review
    item: Text-mined links mapped to the wrong gene
    value: a word that names the disease, a parent, a child or an entry whose evidence it takes (except for a gene
      with curated evidence for the disease); each word listed for the disease
    basis_type: design
    basis: Europe PMC text mining maps words to genes by dictionary, so a word that names something else in the
      literature makes a false link. A word that is the name, abbreviation or synonym of {short}, of a parent or a
      child of it, or of an entry whose evidence it takes is such a word, unless the gene has curated evidence for
      {short}, for which the word is the old name of the gene's locus (PPH1, the BMPR2 locus of familial primary
      pulmonary hypertension). The other words are read against their sentences and listed for the disease. A
      link whose every word is wrong is dropped, a wrong word is removed from a link that keeps another, and a
      listed correction that matches no link stops the build.
    refs: [epmc]
    used_in: sheets 8, 10
  - key: curated_symbols
    item: Curated genes named like a disease
    value: a gene whose symbol is the name or exact synonym of {short}, of a parent or a child of it, or of an entry
      whose evidence it takes is left out of the curated evidence of {short}
    basis_type: design
    basis: Such a gene is linked to the disease by its abbreviation, not by evidence (for example PAH, phenylalanine
      hydroxylase, linked to pulmonary arterial hypertension); the curation log names it.
    used_in: sheets 1, 2, 10
  - key: variants
    item: Variant names
    value: one name per variant, with its dbSNP rsID where established
    basis_type: source
    basis: The abstracts write one variant in several ways (factor V Leiden, FVL, 1691G>A; HLA-B*5201, B(*)5201);
      a list of patterns per gene gives each one name and, for the classic variants, its dbSNP rsID. The name as
      written is kept beside it.
    refs: [dbsnp]
    used_in: sheets 2, 10
  - key: about
    item: What a finding is about
    value: '{short} itself (default); a phenotype or outcome within {short}; another trait; a functional
      experiment; a background statement'
    basis_type: design
    basis: An association with survival, clinical worsening, exercise capacity, a biomarker or the clinical type
      among patients modifies the course of {short}; it is not evidence that the gene raises the risk of {short}.
      Each such finding is read against its source sentence and listed, kept and marked, without raising the
      gene's evidence level; a later finding with words of this kind is logged for review.
    used_in: sheets 1, 2, 10
  - key: place
    item: Place of a genetic study
    value: the country of the first author's institution
    basis_type: design
    basis: The first author's affiliation in PubMed (in Europe PMC when PubMed has none) names the institution that
      led the study, while many abstracts do not name the population. The place sets the Japanese and East Asian
      flags, as does a Japanese or East Asian population the abstract states; a multinational study takes the
      place of its lead institution.
    used_in: sheets 2, 3, 9, A5
  - key: design_class
    item: Design class of a genetic study
    value: case report; genome-wide (GWAS, genome sequencing, Mendelian randomization); clonal hematopoiesis;
      exome or panel sequencing; HLA typing; candidate gene; other (the first that applies)
    basis_type: design
    basis: A study can report several designs; one class by this precedence counts and groups each study once.
    used_in: sheet 3, A5; studies figure
  - key: rebuild
    item: Rebuild from the saved sources
    param: Rebuild
    basis_type: design
    basis: A rebuild re-derives a snapshot from its saved fetch and literature records; no source is queried again
      except PubMed for the record of each publication when it is not yet saved, and Open Targets for gene symbols
      in the snapshot's own release. Model answers come from the cache, and only answers not yet cached are asked.
    used_in: every step
  - key: offline
    item: Language model in this build
    param: LlmOffline
    format: 'cache only: {v}'
    basis_type: design
    basis: A build that changes only the curation calls no model. A generated answer is reused when its inputs are
      unchanged; otherwise it is reported as not generated.
    used_in: sheets 2, 3, 8

- name: East Asian annotation
  items:
  - key: eas_countries
    item: East Asian literature study
    value: done in Japan, China, Korea, Taiwan, Hong Kong or Mongolia, or stated as East Asian
    basis_type: design
    basis: The countries of East Asia. A study is placed by the country of its first author's institution; it
      counts as Japanese when it was done in Japan or its abstract states a Japanese population.
    used_in: sheets 2, 9
  - key: eas_relation
    item: East Asian evidence of a relation
    value: clinical evidence from a study done in East Asia (the country of the first author's institution) or of an
      East Asian population (named as a whole word in the abstract and in the reading, with no country outside East
      Asia named); a shared GWAS signal whose two GWAS, the disease's and the
      condition's, have mostly East Asian samples; never the ontology, a lead-variant overlap, or the condition's other
      studies
    basis_type: user
    basis: Decided with the user (2026-10-20). The flag says where the evidence that relates the condition to the
      disease comes from; a condition with East Asian GWAS of its own, related to the disease by evidence from other
      populations, is not East Asian evidence of the relation (its East Asian GWAS are listed with its genetics). A
      lead-variant overlap rests on a published region without a credible set of the disease, whose sample Open
      Targets does not record. The place of a study counts as for the genetic studies of the disease (a Japanese
      cohort whose abstract names no country is East Asian evidence). One flag, set once, serves the map, the viewer,
      the workbook and the knowledge base.
    used_in: sheets 4, 9; condition map

