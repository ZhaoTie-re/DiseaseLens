# The genome-wide significant regions of the CTEPH GWAS, as published.
#
# Liley et al. (2024), Am J Respir Crit Care Med 209(12):1477-1485, PMID 38470220, Table 1, copied from the
# open-access full text (Europe PMC, PMC11208965) on 2026-10-17. Positions are GRCh37 as in the paper; MAF is
# in controls; P is the CTEPH meta-analysis P value; P_PE the P value for pulmonary embolism from a separate GWAS;
# V the CTEPH P value adjusted for the overall genetic similarity with PE (conditional false discovery rate).
#
# Why this table, not only Open Targets: Open Targets holds no summary statistics for this study and fine-maps
# only the curated top hits it can (three regions: ABO, FGG, F11). The paper's own gene names are used for the
# regions; the locus-to-gene genes of Open Targets are shown beside them where a credible set exists.
#
# `evidence` decides how a region's gene is marked in the gene x condition map:
#   meta  : CTEPH meta-analysis P < 5e-8 (tiers 1-3 on the meta-analysis P)        -> G
#   pe    : genome-wide significant only after leveraging PE, V < 5e-8 (tier 3)   -> G* (marked as such)
source:
  pmid: '38470220'
  pmcid: PMC11208965
  table: Table 1. Genome-Wide Significant Regions for Chronic Thromboembolic Pulmonary Hypertension
  threshold: genome-wide significance, P < 5 x 10^-8
  quotes:
  - "we defined genetic associations at three tiers of significance, all of which generally correspond to a
    genome-wide significance of overall P value <5 × 10−8 with varying levels of evidence in the discovery and
    replication subcohorts."
  - "Two regional associations (FGG and ABO) were found at tier 1 significance, and a further association (MYH7B)
    was found at tier 2 significance."
  - "Two further regions (F11 and HLA-DRA) reached tier 3 significance on the basis of meta-analysis P value."
  - "The coanalyses with PE demonstrated four further associations at tier 3 genome-wide significance (F2, TSPAN15,
    SLC44A2, and F5/NME7)."
  - "V values can be thought of as P values for chronic thromboembolic pulmonary hypertension adjusted to account
    for overall genetic similarity with PE."
