version: '2026-10-16'
note: 'Curated: every evidence quote is checked against its PubMed abstract at each build.'
conditions:
- key: pulmonary_embolism
  name: Pulmonary embolism
  category: Precursor / spectrum
  ot_ids:
  - MONDO_0005279
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '28232411'
    direction: increased risk
    design: meta-analysis
    population: 16 studies, 4,047 PE patients
    statement: CTEPH follows acute PE in about 0.6% of all comers and 3.2% of survivors (meta-analysis of 16 studies).
    quote: In 1186 all comers (two studies), the pooled CTEPH incidence was 0.56% (95% CI 0.1-1.0). In 999 survivors
      (four studies) CTEPH incidence was 3.2% (95% CI 2.0-4.4).
  - pmid: '15163775'
    direction: increased risk
    design: cohort
    population: Italy
    statement: CTEPH is a relatively common, serious complication of PE.
    quote: CTPH is a relatively common, serious complication of pulmonary embolism.
  - pmid: '33334946'
    direction: associated
    design: guideline (ERS statement)
    population: ''
    statement: CTEPH is a rare complication of acute PE, symptomatic or not (ERS statement).
    quote: Chronic thromboembolic pulmonary hypertension (CTEPH) is a rare complication of acute pulmonary embolism,
      either symptomatic or not.
  east_asian:
  - pmid: '39435728'
    direction: increased risk
    design: cohort (registry)
    population: Japan, 2,787 acute PE
    statement: In Japan, 2.3% of acute PE patients were diagnosed with CTEPH within 3 years (DOAC era).
    quote: In the direct oral anticoagulant era, the cumulative diagnosis of CTEPH after acute PE was 2.3% at 3
      years
- key: venous_thromboembolism
  name: Venous thromboembolism
  category: Precursor / spectrum
  ot_ids:
  - MONDO_0005399
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '18799507'
    direction: increased risk
    design: case-control
    population: 3 European centers, n = 687
    statement: Previous VTE (OR 4.5) and recurrent VTE (OR 14.5) are associated with CTEPH.
    quote: previous venous thromboembolism (VTE; OR 4.52, 95% CI 2.35-9.12), recurrent VTE (OR 14.49, 95% CI 5.40-43.08)
  - pmid: '28232411'
    direction: increased risk
    design: meta-analysis
    population: 16 studies
    statement: Recurrent VTE (OR 3.2) and unprovoked PE (OR 4.1) raise the risk of CTEPH after PE.
    quote: Both recurrent venous thromboembolism and unprovoked PE were significantly associated with a higher risk
      of CTEPH, with odds ratios of 3.2 (95% CI 1.7-5.9) and 4.1 (95% CI 2.1-8.2) respectively.
- key: deep_vein_thrombosis
  name: Deep vein thrombosis
  category: Precursor / spectrum
  ot_ids:
  - EFO_0003907
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '29985100'
    direction: increased risk
    design: cohort (population-based)
    population: England, 23,329 first VTE
    statement: 'CTEPH follows DVT less often than PE: 0.3% and 1.3% at 2 and 10 years after DVT.'
    quote: cumulative incidence was 1.3% and 3.3% at 2 and 10 years after pulmonary embolism, and 0.3% and 1.3%
      following deep vein thrombosis (DVT), respectively.
  - pmid: '29985100'
    direction: associated
    design: cohort (population-based)
    population: England
    statement: CTEPH develops most commonly after PE and less frequently after DVT.
    quote: CTEPH develops most commonly after pulmonary embolism and less frequently after DVT.
  east_asian:
  - pmid: '18931448'
    direction: associated
    design: cohort
    population: Japan, 150 CTEPH
    statement: Japanese women with CTEPH had less DVT and fewer acute embolic episodes than men.
    quote: The female patients were elderly and had less deep vein thrombosis, less acute embolic episodes, better
      cardiac function, lower arterial oxygen tension and more peripheral thrombi, and showed less improvement through
      surgery than males.
  - pmid: '19165231'
    direction: associated
    design: case-control
    population: Japan
    statement: More than half of CTEPH patients, especially Japanese, have no prior DVT or coagulation abnormality.
    quote: However, more than half of the CTEPH patients, especially the Japanese, do not have prior DVT or coagulation
      abnormality, suggesting that there should be other risk factors for CTEPH.
- key: ctepd
  name: Chronic thromboembolic pulmonary disease without PH (CTEPD)
  category: Precursor / spectrum
  ot_ids: []
  genetics: none
  mendelian: false
  genes: []
  evidence:
  - pmid: '40653349'
    direction: associated (spectrum)
    design: review
    population: ''
    statement: CTEPD is the broader term; CTEPH refers to the patients with pulmonary hypertension.
    quote: Chronic thromboembolic pulmonary disease is the broader term for symptomatic patients with mismatched
      perfusion defects and signs of chronic thrombi on pulmonary vascular imaging, after at least 3 months of therapeutic
      anticoagulation, with CTEPH specifically referring to those with pulmonary hypertension.
  - pmid: '36307107'
    direction: associated (spectrum)
    design: review
    population: ''
    statement: CTEPH and CTEPD describe chronic thromboembolic occlusions with or without PH at rest.
    quote: Chronic thromboembolic pulmonary hypertension (CTEPH) and chronic thromboembolic pulmonary disease (CTEPD)
      are two terms characterizing symptomatic patients with chronic thromboembolic occlusions of pulmonary arteries
      with or without pulmonary hypertension at rest.
- key: antiphospholipid_syndrome
  name: Antiphospholipid syndrome / antiphospholipid antibodies
  category: Risk factor
  ot_ids:
  - MONDO_8000010
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '18799507'
    direction: increased risk
    design: case-control
    population: 3 European centers, n = 687
    statement: Lupus anticoagulant / antiphospholipid antibodies are associated with CTEPH (OR 4.2).
    quote: lupus anticoagulant/antiphospholipid antibodies (OR 4.20, 95% CI 1.56-12.21) were more often associated
      with CTEPH
  - pmid: '30603858'
    direction: associated
    design: meta-analysis
    population: 8 studies
    statement: About 12% of CTEPH patients carry antiphospholipid antibodies (meta-analysis).
    quote: yields a rate of aPL antibody-positive profile of 12.06% (95% CI 8.12-16.65%) among the patients with
      CTEPH in the random effects model
  - pmid: '10706510'
    direction: associated
    design: case-control
    population: France
    statement: Phospholipid-dependent antibodies were found in 20% of CTEPH patients.
    quote: In contrast, a high frequency of phospholipid-dependent antibodies was observed in PPH (10%) and more
      notably in CTEPH (20%).
  - pmid: '20182352'
    direction: no association found
    design: case-control
    population: UK, 45 CTEPH
    statement: In one UK study antiphospholipid antibodies were not increased in CTEPH.
    quote: Contrary to other studies, antiphospholipid antibodies (APA) were not increased.
  - pmid: '34836752'
    direction: associated
    design: cohort
    population: Israel, 504 APS
    statement: CTEPH was found in 3.8% of an APS cohort.
    quote: CTEPH prevalence was 3.8% in our APS cohort
- key: splenectomy
  name: Splenectomy
  category: Risk factor
  ot_ids: []
  genetics: none
  mendelian: false
  genes: []
  evidence:
  - pmid: '16085731'
    direction: increased risk
    design: case-control
    population: France, 257 CTEPH
    statement: 8.6% of CTEPH patients had a splenectomy, against 2.5% in IPAH.
    quote: In patients with CTEPH, 8.6% (95% CI 5.2 to 12.0) had a history of splenectomy compared with 2.5% (95%
      CI 0.7 to 4.4) and 0.56% (95% CI 0 to 1.6) in cases of idiopathic pulmonary arterial hypertension and other
      chronic pulmonary conditions, respectively (p<0.01).
  - pmid: '15735803'
    direction: increased risk
    design: case-control (vs PE)
    population: Austria, 109 CTEPH vs 187 PE
    statement: Splenectomy (OR 13), VA shunts (OR 13) and chronic inflammatory disorders raise the risk of CTEPH
      after PE.
    quote: Splenectomy (odds ratio=13, 95% CI 2.7-127), ventriculo-atrial (VA-) shunt for the treatment of hydrocephalus
      (odds ratio=13, 95% CI 2.5-129) and chronic inflammatory disorders, such as osteomyelitis and inflammatory
      bowel disease (IBD, odds ratio=67, 95% CI 7.9-8832) were associated with an increased risk of CTEPH.
  - pmid: '38385544'
    direction: increased risk
    design: cohort
    population: Slovakia, 62 splenectomised
    statement: The 5-year cumulative incidence of CTEPH after splenectomy was 3.2%.
    quote: The study confirmed a higher incidence of CTEPH after splenectomy compared to published data, the 5-year
      cumulative incidence was 3.2 %.
  - pmid: '35000431'
    direction: mixed
    design: case-control (vs PE)
    population: USA
    statement: Against PE controls, only a trend toward more splenectomy and non-O blood group remained.
    quote: The conditions studied were equally frequent in the CTEPH and PE cohorts, although there was a trend
      towards an increased frequency of splenectomy and non-O blood group among the CTEPH cohort.
- key: va_shunt_devices
  name: Ventriculoatrial shunt, infected pacemaker and intravascular devices
  category: Risk factor
  ot_ids: []
  genetics: none
  mendelian: false
  genes: []
  evidence:
  - pmid: '18799507'
    direction: increased risk
    design: case-control
    population: 3 European centers, n = 687
    statement: VA shunts and infected pacemakers are strongly associated with CTEPH (OR 76).
    quote: Ventriculo-atrial shunts and infected pacemakers (odds ratio (OR) 76.40, 95% confidence interval (CI)
      7.67-10,351)
  - pmid: '18239156'
    direction: increased risk
    design: case series
    population: Austria
    statement: VA-shunt carriers with shunt infection are at increased risk of CTEPH; staphylococcal DNA was found
      in their thrombi.
    quote: Patients who carry ventriculo-atrial (VA-) shunts for the treatment of hydrocephalus and report a history
      of shunt infection are at an increased risk for CTEPH.
- key: hypothyroidism
  name: Hypothyroidism / thyroid replacement therapy
  category: Comorbidity
  ot_ids:
  - MONDO_0005420
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '18799507'
    direction: increased risk
    design: case-control
    population: 3 European centers, n = 687
    statement: Thyroid replacement therapy (OR 6.1) and malignancy (OR 3.8) emerged as CTEPH risk factors.
    quote: Thyroid replacement therapy (OR 6.10, 95% CI 2.73-15.05) and a history of malignancy (OR 3.76, 95% CI
      1.47-10.43) emerged as novel CTEPH risk factors.
  - pmid: '31734602'
    direction: associated
    design: cohort
    population: Germany, 228 CTEPH
    statement: A quarter of operable CTEPH patients had thyroid disease, mostly hypothyroidism.
    quote: 24.1% of patients had known thyroid disease (of those, 78.2% hypothyroidism)
  - pmid: '22379171'
    direction: increased risk
    design: review
    population: ''
    statement: 'Review: splenectomy, cancer, VA shunt, chronic inflammation, antiphospholipid antibodies and hypothyroidism
      raise CTEPH risk.'
    quote: Medical conditions that are associated with an increased risk of CTEPH include a history of splenectomy,
      cancer, ventriculoatrial shunt, chronic inflammatory disease, antiphospholipid antibodies and hypothyroidism.
- key: cancer
  name: Malignancy (history of cancer)
  category: Comorbidity
  ot_ids:
  - MONDO_0004992
  genetics: none
  mendelian: true
  genes: []
  evidence:
  - pmid: '18799507'
    direction: increased risk
    design: case-control
    population: 3 European centers, n = 687
    statement: A history of malignancy (OR 3.8) emerged as a CTEPH risk factor.
    quote: Thyroid replacement therapy (OR 6.10, 95% CI 2.73-15.05) and a history of malignancy (OR 3.76, 95% CI
      1.47-10.43) emerged as novel CTEPH risk factors.
  - pmid: '35000431'
    direction: no association found
    design: case-control (vs PE)
    population: USA
    statement: Against PE controls, malignancy and other conditions did not raise the risk of CTEPH.
    quote: Thus, other than the possible exceptions of splenectomy and non-O blood group, the investigated medical
      conditions do not appear likely to increase the risk of CTEPH as an outcome of acute PE, and thus are unlikely
      to be useful in predicting CTEPH risk among PE survivors.
  east_asian:
  - pmid: '39486772'
    direction: associated
    design: cohort
    population: Japan, 1,270 CTEPH
    statement: 10.6% of 1,270 Japanese CTEPH patients had a history of cancer.
    quote: Of the 1,270 patients in the cohort, 134 (10.6%) had a history of cancer, with the most common primary
      sites being the breast in women and the prostate in men.
  - pmid: '37615801'
    direction: increased risk
    design: cohort
    population: Japan, 99 CTEPH
    statement: Cancer is a known risk factor for CTEPH.
    quote: Cancer is a known risk factor for CTEPH.
  note: 'Genetics not fetched: cancer as a whole is too broad a phenotype. '
- key: inflammatory_bowel_disease
  name: Inflammatory bowel disease
  category: Comorbidity
  ot_ids:
  - MONDO_0005265
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '15735803'
    direction: increased risk
    design: case-control (vs PE)
    population: Austria
    statement: Chronic inflammatory disorders such as IBD and osteomyelitis were associated with CTEPH (OR 67, wide
      CI).
    quote: Splenectomy (odds ratio=13, 95% CI 2.7-127), ventriculo-atrial (VA-) shunt for the treatment of hydrocephalus
      (odds ratio=13, 95% CI 2.5-129) and chronic inflammatory disorders, such as osteomyelitis and inflammatory
      bowel disease (IBD, odds ratio=67, 95% CI 7.9-8832) were associated with an increased risk of CTEPH.
  - pmid: '27826972'
    direction: associated
    design: case series
    population: Slovakia, 81 CTEPH
    statement: IBD was among the risk factors identified in a CTEPH series.
    quote: 'CTEPH risk factors were identified as follows: pulmonary embolism (PE), deep vein thrombosis (DVT),
      thyreopathy, blood type other than "0", inflammatory bowel disease, malignancy, splenectomy, pacemaker.'
  - pmid: '35000431'
    direction: no association found
    design: case-control (vs PE)
    population: USA
    statement: Against PE controls, the conditions studied (including IBD) were equally frequent.
    quote: The conditions studied were equally frequent in the CTEPH and PE cohorts, although there was a trend
      towards an increased frequency of splenectomy and non-O blood group among the CTEPH cohort.
- key: osteomyelitis
  name: Chronic osteomyelitis
  category: Comorbidity
  ot_ids:
  - MONDO_0005246
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '15735803'
    direction: increased risk
    design: case-control (vs PE)
    population: Austria
    statement: Osteomyelitis was among the chronic inflammatory disorders associated with CTEPH.
    quote: Splenectomy (odds ratio=13, 95% CI 2.7-127), ventriculo-atrial (VA-) shunt for the treatment of hydrocephalus
      (odds ratio=13, 95% CI 2.5-129) and chronic inflammatory disorders, such as osteomyelitis and inflammatory
      bowel disease (IBD, odds ratio=67, 95% CI 7.9-8832) were associated with an increased risk of CTEPH.
  - pmid: '17420352'
    direction: associated
    design: cohort
    population: Austria, 181 CTEPH
    statement: Splenectomy, VA shunt, central lines, IBD and osteomyelitis were associated with CTEPH development.
    quote: Recently, associated medical conditions such as splenectomy, ventriculoatrial shunt for the treatment
      of hydrocephalus, permanent central intravenous lines, inflammatory bowel disease, and osteomyelitis were
      found to be associated with the development of CTEPH.
- key: myeloproliferative_neoplasm
  name: Myeloproliferative neoplasm
  category: Comorbidity
  ot_ids:
  - EFO_0004251
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '37311222'
    direction: associated
    design: cohort (registry)
    population: France, 90 MPN with PH
    statement: Half of the PH patients with an MPN had CTEPH; PV and ET were mostly related to CTEPH.
    quote: Half of the patients were diagnosed with chronic thromboembolic PH (CTEPH); the other half were considered
      to have group 5 PH. MF was preferentially associated with group 5 PH, whereas PV and ET were generally related
      to CTEPH.
  - pmid: '32397294'
    direction: increased risk
    design: case series (gene panel)
    population: Germany, 40 CTEPH
    statement: Three of 40 CTEPH patients carried JAK2 p.Val617Phe, each with an MPN; more than expected.
    quote: three further patients carried the same pathogenic variant (missense variant, c.1849G>T p.Val617Phe)
      in the Janus kinase 2 (JAK2) gene. The latter led to a myeloproliferative disease in each patient. The prevalence
      of this JAK2 variant was significantly higher than expected (p < 0.0001).
  east_asian:
  - pmid: '41808951'
    direction: associated
    design: cohort (registry)
    population: Japan, 129 CTEPH
    statement: 5.4% of CTEPH patients in a Japanese registry had an MPN.
    quote: Seven patients had concomitant MPN as the underlying cause for CTEPH, accounting for 5.4% (7/129) of
      CTEPH cases.
- key: essential_thrombocythemia
  name: Essential thrombocythemia
  category: Comorbidity
  ot_ids:
  - MONDO_0005029
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '37311222'
    direction: associated
    design: cohort (registry)
    population: France
    statement: PV and ET were generally related to CTEPH among MPN patients with PH.
    quote: Half of the patients were diagnosed with chronic thromboembolic PH (CTEPH); the other half were considered
      to have group 5 PH. MF was preferentially associated with group 5 PH, whereas PV and ET were generally related
      to CTEPH.
- key: polycythemia_vera
  name: Polycythemia vera
  category: Comorbidity
  ot_ids:
  - MONDO_0009891
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '37311222'
    direction: associated
    design: cohort (registry)
    population: France
    statement: PV and ET were generally related to CTEPH among MPN patients with PH.
    quote: Half of the patients were diagnosed with chronic thromboembolic PH (CTEPH); the other half were considered
      to have group 5 PH. MF was preferentially associated with group 5 PH, whereas PV and ET were generally related
      to CTEPH.
- key: clonal_hematopoiesis
  name: Clonal hematopoiesis
  category: Comorbidity
  ot_ids:
  - EFO_0010819
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '38116660'
    direction: associated
    design: cohort (sequencing)
    population: China, 499 CTEPH
    statement: 9.4% of CTEPH patients carried a CHIP mutation (VAF >= 2%).
    quote: In total, 47 (9.4%) patients with CTEPH carried at least 1 CHIP mutation at a variant allele frequency
      of ≥2%.
  east_asian:
  - pmid: '39604025'
    direction: associated
    design: cohort (WES + panel)
    population: Japan, 214 CTEPH
    statement: 20.1% of Japanese CTEPH patients had variants in clonal-hematopoiesis genes.
    quote: Among the enrolled patients, 20.1%, notably 44.4% who were 80 to 89 years old, had variants in CH-associated
      genes.
- key: sickle_cell_disease
  name: Sickle cell disease and hemoglobinopathies
  category: Comorbidity
  ot_ids:
  - MONDO_0011382
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '31537700'
    direction: associated
    design: case series (registry)
    population: France, 58 SCD with PH
    statement: Thrombotic lesions are a major component of PH in sickle cell disease.
    quote: Thrombotic lesions appear as a major component of PH related to SCD, more frequently in SC patients.
  - pmid: '39063629'
    direction: associated
    design: case series
    population: Greece, 28 patients
    statement: A third of hemolytic-anemia PH patients had CTEPH (50% of SCD).
    quote: 32.1% had chronic thromboembolic PH (CTEPH) (29% of b-thalassemia and 50% of SCD patients)
  - pmid: '30088118'
    direction: increased risk
    design: case report
    population: ''
    statement: Hemoglobinopathies and congenital hemolytic anemia predispose to CTEPH.
    quote: Haemoglobinopathies and congenital haemolytic anaemia constitute a unique patients population more predisposed
      to developing chronic thromboembolic pulmonary hypertension (CTEPH).
- key: thrombophilia
  name: Inherited thrombophilia
  category: Risk factor
  ot_ids:
  - MONDO_0002305
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '10706510'
    direction: no association found
    design: case-control
    population: France
    statement: Hereditary thrombotic risk factors were not increased in CTEPH.
    quote: The prevalence of hereditary thrombotic risk factors was not increased in patients with either PPH or
      CTEPH.
  - pmid: '20182352'
    direction: increased risk
    design: case-control
    population: UK
    statement: Factor V Leiden was more frequent in white CTEPH patients (29% vs 7.8%).
    quote: Nine of 31 (29%) white patients with CTEPH versus 10 of 129 (7.8%) patients with non-CTEPH were heterozygous
      for factor V Leiden (FVL; P = 0.001).
  - pmid: '41007777'
    direction: associated
    design: meta-analysis
    population: 8 studies, 677 CTEPH
    statement: About one in seven CTEPH patients has a congenital thrombophilia, mostly protein S or C deficiency.
    quote: Approximately one in seven patients with CTEPH harbours a congenital thrombophilia, most often protein
      S or protein C deficiency, whereas classic venous-thrombo-embolism mutations are rare and ethnically restricted.
  - pmid: '39150410'
    direction: increased risk
    design: case-control (candidate SNP)
    population: Czech Republic, 129 CTEPH
    statement: Prothrombin rs1799963 was more common in CTEPH than in controls.
    quote: The study found that the rs1799963 variant was more common in patients with chronic thromboembolic pulmonary
      hypertension (CTEPH) compared to the control group (p < .0001).
  east_asian:
  - pmid: '36338413'
    direction: associated
    design: cohort
    population: China, 367 CTEPH (East Asian)
    statement: In Chinese CTEPH patients, 9.8% had congenital thrombophilia (protein C/S, antithrombin); no FVL
      or F2 G20210A.
    quote: 'A total of 36 (9.8%; 95% CI: 6.8%-12.9%) patients were diagnosed as congenital thrombophilia, including
      13 protein C deficiency (3.5%; 95% CI: 1.6%-5.4%), 19 protein S deficiency (5.2%; 95% CI: 2.9%-7.5%), and
      4 antithrombin III deficiency (1.1%; 95% CI: 0%-2.2%). No factor V Leiden or prothrombin G20210A sequence
      variants were identified.'
- key: non_o_blood_group
  name: Non-O blood group
  category: Risk factor
  ot_ids:
  - EFO_0600059
  genetics: none
  mendelian: false
  genes:
  - ABO
  evidence:
  - pmid: '18799507'
    direction: increased risk
    design: case-control
    population: 3 European centers, n = 687
    statement: Non-O blood groups are associated with CTEPH (OR 2.1).
    quote: blood groups other than 0 (2.09, 95% CI 1.12-3.94)
  - pmid: '23677493'
    direction: increased risk
    design: case-control
    population: 8 European centers
    statement: The association of CTEPH with prior VTE and non-O blood groups was confirmed.
    quote: This study confirmed the association of CTEPH with history of acute venous thromboembolism and blood
      groups non-O
  - pmid: '38470220'
    direction: associated
    design: GWAS
    population: European, 1,907 cases
    statement: The CTEPH GWAS found loci at ABO, FGG, F11, MYH7B and HLA-DRA.
    quote: Our primary association study revealed genetic associations at the ABO, FGG, F11, MYH7B, and HLA-DRA
      loci.
  note: The blood group is carried by the ABO gene; its GWAS signal is the CTEPH ABO locus.
- key: factor_viii
  name: Factor VIII level
  category: Intermediate trait
  ot_ids:
  - EFO_0004630
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '12958604'
    direction: increased risk
    design: case-control
    population: Austria, 122 CTEPH
    statement: Elevated FVIII was more prevalent in CTEPH (41%) than in controls (5%).
    quote: FVIII > 230IU/dl was more prevalent in CTEPH patients (41%) than in controls (5%, p < 0.0001) and PAH
      patients (22%, p = 0.022).
  - pmid: '20182352'
    direction: increased risk
    design: case-control
    population: UK
    statement: FVIII and VWF were higher in CTEPH than in other PH.
    quote: Elevated factor VIII (FVIII) and von Willebrand factor (VWF; >1.5 U/ml) were common in CTEPH and non-CTEPH,
      although significantly higher (P = 0.01 for FVIII and 0.009 for VWF) in CTEPH versus non-CTEPH.
  - pmid: '27571001'
    direction: increased risk
    design: review
    population: ''
    statement: 'Review: antiphospholipid antibodies, increased FVIII, non-O blood groups and chronic inflammation
      are the most consistent risk factors.'
    quote: Risk factors most consistently associated with CTEPH are circulating anti-phospholipid antibodies or
      lupus anticoagulant, increased factor VIII, non-O blood groups, and chronic inflammatory diseases.
- key: von_willebrand_factor
  name: von Willebrand factor level
  category: Intermediate trait
  ot_ids:
  - OBA_1000199
  genetics: full
  mendelian: true
  genes: []
  evidence:
  - pmid: '30655285'
    direction: increased risk
    design: case-control
    population: UK, 208 CTEPH
    statement: CTEPH patients had decreased ADAMTS13 and increased VWF.
    quote: Patients with CTEPH had decreased ADAMTS13 (adjusted β -23.4%, 95% CI -30.9- -15.1%, p<0.001) and increased
      VWF levels (β +75.5%, 95% CI 44.8-113%, p<0.001) compared to healthy controls.
  - pmid: '35081007'
