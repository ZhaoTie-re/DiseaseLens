- pmid: '15640334'
  direction: increased risk
  design: case-control
  population: Japan, 80 CTEPH vs 678 controls
  statement: HLA-B*52:01 (40% vs 24%) and DPB1*02:02 (19% vs 6%) are more frequent in Japanese CTEPH.
  quote: The frequencies of HLA-B*5201 (40 versus 24%) and DPB1*0202 (19 versus 6%) were significantly higher in
    the patients.
  topic: HLA (Japanese)
- pmid: '19165231'
  direction: increased risk
  design: case-control
  population: Japan, 160 CTEPH vs 380 controls
  statement: HLA markers (DPB1*02:02, B*52:01) and NFKBIL1 are associated with DVT-negative CTEPH only.
  quote: We found a strong association of HLA markers with the DVT-negative CTEPH
  topic: HLA (Japanese)
- pmid: '38470220'
  direction: associated
  design: GWAS
  population: European
  statement: 'The CTEPH GWAS: 1,907 European cases and 10,363 controls.'
  quote: We conducted a genome-wide association study on 1,907 European cases and 10,363 European control subjects.
  topic: GWAS
- pmid: '38470220'
  direction: associated
  design: GWAS
  population: European
  statement: CTEPH is partially heritable and polygenic, with genetics related to but distinct from PE and DVT.
  quote: Chronic thromboembolic pulmonary hypertension is a partially heritable polygenic disease, with related
    though distinct genetic associations with pulmonary embolism and deep vein thrombosis.
  topic: GWAS
- pmid: '34409094'
  direction: associated
  design: cohort (registry)
  population: worldwide incl. Japan
  statement: In the worldwide registry, 75% of Japanese CTEPH patients were female.
  quote: Sex was evenly balanced, except in Japan where 75% of patients were female.
  topic: Epidemiology (Japan)
- pmid: '18931448'
  direction: associated
  design: cohort
  population: Japan, 150 CTEPH
  statement: Japanese women with CTEPH have less DVT and fewer acute embolic episodes.
  quote: The female patients were elderly and had less deep vein thrombosis, less acute embolic episodes, better
